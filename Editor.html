<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --winform-bg: #000;
}

html, body {
    margin: 0;
    height: 100%;
    background: var(--winform-bg);
}

textarea {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: white;
    font-family: Consolas;
    font-size: 14px;
    padding: 10px;
}
</style>
</head>

<body>
<textarea id="editor"></textarea>

<script>
function getContent() {
    return document.getElementById("editor").value;
}
function setBackground(color) {
    document.documentElement.style.setProperty('--winform-bg', color);
}
document.getElementById("editor").addEventListener("input", () => {
    window.chrome.webview.postMessage({
        type: "content",
        data: getContent()
    });
});
</script>
</body>
</html>
